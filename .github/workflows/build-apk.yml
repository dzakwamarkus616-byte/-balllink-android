name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        run: |
          cd android-balllink
          chmod +x gradlew
         ./gradlew assembleRelease
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: balllink-apk
          path: android-balllink/app/build/outputs/apk/release/app-release.apk
