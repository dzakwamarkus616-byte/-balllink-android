name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install and Build Web
        run: |
          npm install
          npm run build
          npx cap sync android || true
      - name: Build APK
        working-directory: android-balllink
        run: |
          chmod +x gradlew
         ./gradlew assembleRelease --stacktrace
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: balllink-apk
          path: android-balllink/app/build/outputs/apk/release/*.apk